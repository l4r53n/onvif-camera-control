name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          # PolyForm Noncommercial 1.0.0 is not currently recognized by HACS'
          # GitHub license check (SPDX NOASSERTION). Keep all other checks.
          # https://github.com/hacs/integration/issues/5561
          ignore: license

  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  offline-tests:
    name: Offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test runner
        run: python -m pip install pytest PyYAML
      - name: Check Python syntax
        run: python -m compileall -q custom_components tools tests
      - name: Run tests
        run: python -m pytest tests -q
